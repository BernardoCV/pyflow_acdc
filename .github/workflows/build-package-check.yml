name: Package build check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    name: Build and validate distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install built wheel with OPF extra dep
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip install pyomo

      - name: Assert subpackages are in the wheel
        run: |
          python - <<'PY'
          import importlib.util
          for name in (
              "pyflow_acdc.NL_models",
              "pyflow_acdc.L_models",
          ):
              if importlib.util.find_spec(name) is None:
                  raise SystemExit(f"missing packaged subpackage: {name}")
              print(f"ok {name}")
          PY

      - name: Import smoke test
        run: |
          python - <<'PY'
          import pyflow_acdc as pyf
          from pyflow_acdc.NL_models.ACDC_Static_TEP import transmission_expansion
          from pyflow_acdc.NL_models.ACDC_MultiPeriod_TEP import multi_period_transmission_expansion
          from pyflow_acdc.NL_models.ACDC_sequential_STEP import sequential_STEP
          from pyflow_acdc.L_models.ACDC_L_TEP import linear_multi_period_transmission_expansion

          for attr in (
              "expand_elements_from_pd",
              "transmission_expansion",
              "multi_period_transmission_expansion",
              "sequential_STEP",
              "linear_multi_period_transmission_expansion",
          ):
              if not hasattr(pyf, attr):
                  raise SystemExit(f"pyflow_acdc missing attribute after install: {attr}")

          print("import ok")
          PY

      - name: Example grid smoke test (installed wheel only)
        run: |
          python - <<'PY'
          import pyflow_acdc as pyf

          CASES = (
              ("case118_TEP_benchmark", lambda: pyf.cases["case118_TEP_benchmark"]()),
              ("case24_MP", lambda: pyf.cases["case24_MP"]()),
              ("CigreB4_ACDC", lambda: pyf.cases["CigreB4_ACDC"]()),
              (
                  "NS_MTDC_2025",
                  lambda: pyf.cases["NS_MTDC_2025"](
                      years_data="24", expandable=False, online=False
                  ),
              ),
          )

          for name, load in CASES:
              grid, res = load()
              if grid is None or res is None:
                  raise SystemExit(f"{name}: factory returned None")
              if not grid.nodes_AC and not grid.nodes_DC:
                  raise SystemExit(f"{name}: grid has no nodes")
              print(f"ok {name}")

          print("wheel example-grid smoke ok")
          PY
